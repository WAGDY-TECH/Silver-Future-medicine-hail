@media print{body.pr #app,body.pr #login,body.pr #mod{display:none!important}body.pr #pa{display:block}body{background:#fff}.sheet{border:0}@page{margin:10mm}}

<script>

const PG={dash:'لوحة التحكم',sup:'الموردون',mov:'حركة الموردين',ph:'الصيادلة',wk:'العمال',emp:'الموظفون',rep:'الكشوف والتقارير',users:'المستخدمون والصلاحيات',prof:'الصفحة الشخصية'};
const SK={dash:'D',sup:'S',mov:'M',ph:'P',wk:'W',emp:'E',rep:'R',users:'U',prof:'O'};
const $=s=>document.querySelector(s),f=n=>(+n||0).toLocaleString('en-US'),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let S=null;try{S=JSON.parse(localStorage.getItem('saan1'))}catch(e){}
if(!S){S={sup:D.sup.map(r=>({n:r[1],rep:r[2]||'',tel:r[3]||'',open:r[4]||0,st:r[8]||''})),mov:D.mov.map(r=>({d:r[0],c:r[1],t:r[2],a:r[3]||0,note:r[4]||''})),
ph:D.ph.map(r=>({n:r[1],open:r[2]||0})),phm:D.phm.map(r=>({d:r[0],p:r[1],t:r[2],a:r[4]||0})),
wk:D.wk.map(r=>({n:r[1],sal:r[2]||0,paid:r[3]||0,last:r[4]||'',note:r[6]||''})),emp:[],
users:[{u:'SHAABAN',p:'00000',name:'SHAABAN EDRIS',role:'admin',perm:Object.keys(PG),photo:''}]};
S.ph.forEach(p=>S.emp.push({n:p.n,job:'صيدلي',addr:'',tel:'',rid:'',rexp:'',join:'',sal:S.phm.filter(m=>m.p==p.n&&m.t=='راتب').reduce((a,m)=>a+m.a,0),note:''}));

const save=()=>{try{localStorage.setItem('saan1',JSON.stringify(S))}catch(e){}};
let U=null,V={p:'dash',q:''};const RW=()=>U.role!='viewer',ab=h=>RW()?h:'';
const sum=(a,fn)=>a.reduce((x,y)=>x+(+fn(y)||0),0);
const supSt=s=>{const m=S.mov.filter(x=>x.c==s.n),b=sum(m.filter(x=>x.t=='شراء'),x=>x.a),p=sum(m.filter(x=>x.t=='سداد'),x=>x.a);return{b,p,cur:(+s.open||0)+b-p}};

const ft=a=>`<tfoot><tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr></tfoot>`;
const m=o=>!V.q||JSON.stringify(o).toLowerCase().includes(V.q.toLowerCase());

/* ---------- auth ---------- */

/* ---------- global search ---------- */
function gsr(q){q=q.trim().toLowerCase();const g=$('#gr');if(!q){g.style.display='none';return}const R=[],add=(t,p,o,s)=>{if(JSON.stringify(o).toLowerCase().includes(q)&&can(p))R.push([t,p,s])};
S.sup.forEach(s=>add('شركة','sup',s,`${s.n} ${s.rep} | المديونية ${f(supSt(s).cur)}`));S.mov.forEach(x=>add('حركة','mov',x,`${x.d} ${x.c} ${x.t} ${f(x.a)} ${x.note}`));

modal(`<h3>${i<0?'إضافة مستخدم':'تعديل مستخدم'}</h3><div class="fg"><label>الاسم الظاهر<input id="un" value="${E(u.name||'')}"></label><label>اسم الدخول<input id="uu" value="${E(u.u||'')}" ${i==0?'disabled':''}></label><label>كلمة المرور<input id="up" value="${E(u.p||'')}"></label><label>الصلاحية<select id="ur"><option value="admin" ${u.role=='admin'?'selected':''}>مدير (كل الصلاحيات)</option><option value="acc" ${u.role=='acc'?'selected':''}>محاسب (تعديل)</option><option value="viewer" ${u.role=='viewer'?'selected':''}>مشاهدة فقط</option></select></label></div><div class="pl"><b>الصفحات المسموحة:</b><br>${Object.keys(PG).map(p=>`<label><input type="checkbox" class="pk" value="${p}" ${(u.perm||[]).includes(p)?'checked':''}> ${PG[p]}</label>`).join('')}</div><div style="margin-top:10px"><button class="b" onclick="mOk()">حفظ</button><button class="b g" onclick="mClose()">إلغاء</button></div>`);
M.ok=()=>{const o={name:$('#un').value.trim(),u:$('#uu').value.trim(),p:$('#up').value,role:$('#ur').value,perm:[...document.querySelectorAll('.pk:checked')].map(x=>x.value)};if(!o.name||!o.u||!o.p)return alert('أكمل البيانات');if(S.users.some((x,k)=>k!=i&&x.u.toLowerCase()==o.u.toLowerCase()))return alert('اسم الدخول مستخدم');if(i==0){o.role='admin';o.u=u.u}
if(i<0)S.users.push(Object.assign({photo:''},o));else Object.assign(u,o);save();mClose();render()}}
P.prof=()=>`<div class="ttl"><h2>الصفحة الشخصية</h2></div><div class="pc"><div><div class="ph2" style="${U.photo?`background-image:url(${U.photo})`:''}">${U.photo?'':'لا توجد صورة'}</div><label class="b s" style="display:block;text-align:center;margin-top:6px;cursor:pointer">تغيير الصورة<input type="file" accept="image/*" hidden onchange="img(this,d=>{U.photo=d})"></label></div>
<div class="fg"><label>الاسم الظاهر<input id="pn" value="${E(U.name)}"></label><label>اسم الدخول<input value="${E(U.u)}" disabled></label><label>كلمة المرور الحالية<input id="po" type="password"></label><label>كلمة مرور جديدة<input id="pw" type="password"></label><div class="w"><button class="b" onclick="saveProf()">حفظ التغييرات</button></div></div></div>`;
function saveProf(){const n=$('#pn').value.trim(),w=$('#pw').value;if(n)U.name=n;if(w){if($('#po').value!=U.p)return alert('كلمة المرور الحالية غير صحيحة');U.p=w}save();alert('تم الحفظ');render()}
/* ---------- calculator ---------- */
function calc(){modal(`<h3>الآلة الحاسبة</h3><input id="cd" onkeydown="if(event.key=='Enter')cE()"><div class="calc">${['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','⌫','='].map(k=>`<button class="${'/*-+='.includes(k)?'o':''}" onclick="cK('${k}')">${k=='*'?'×':k=='/'?'÷':k}</button>`).join('')}</div><div style="margin-top:8px"><button class="b g" onclick="mClose()">إغلاق</button></div>`);setTimeout(()=>$('#cd').focus(),50)}
function cK(k){const d=$('#cd');if(k=='C')d.value='';else if(k=='⌫')d.value=d.value.slice(0,-1);else if(k=='=')cE();else d.value+=k}
function cE(){const d=$('#cd');try{if(!/^[0-9+\-*/.() ]+$/.test(d.value))throw 0;d.value=+(Function('return '+d.value)()).toFixed(6)}catch(e){d.value='خطأ'}}
/* ---------- shell ---------- */
function tick(){const n=new Date();$('#clk').innerHTML=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}).replace(/ (AM|PM)/,'<small> $1</small>');$('#dt').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
setInterval(tick,10000);tick();
document.addEventListener('keydown',e=>{if(!U)return;if(e.key=='Escape')mClose();if(e.key=='F2'){e.preventDefault();$('#gq').focus();return}if(!e.altKey)return;const c=e.code.replace('Key','');
if(c=='F'){e.preventDefault();$('#gq').focus()}else if(c=='C'){e.preventDefault();calc()}else if(c=='Q'){e.preventDefault();logout()}else{const p=Object.keys(SK).find(k=>SK[k]==c);if(p){e.preventDefault();go(p)}}});
try{const su=sessionStorage.getItem('saan_u');const u=S.users.find(x=>x.u==su);if(u){U=u;start()}}catch(e){}
</script></body></html>
